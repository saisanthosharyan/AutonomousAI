[pytest]
testpaths =
    backend/test
    backend/test_build.py

norecursedirs =
    generated_projects
    backend/generated_projects
    .git
    .venv
    venv
    env
    node_modules
    __pycache__
    .pytest_cache

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra